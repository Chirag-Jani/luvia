[programs.devnet]
luvia_presale = "3UFQfTbemvnU5ADGfQ4hQHckAm3x9iHrzMpkC6M3z5Ho"

[programs.localnet]
luvia_presale = "3UFQfTbemvnU5ADGfQ4hQHckAm3x9iHrzMpkC6M3z5Ho"

[programs.mainnet]
luvia_presale = "3UFQfTbemvnU5ADGfQ4hQHckAm3x9iHrzMpkC6M3z5Ho"

[registry]
url = "https://api.apr.dev"

[provider]
